# stream{} context. End-to-end mTLS/ALPN are preserved; no TLS termination.
upstream svs_private_haproxy { server 10.77.1.11:9443; }
server {
    listen 10.77.0.10:9443;
    proxy_pass svs_private_haproxy;
    ssl_preread on;
    preread_buffer_size 16k;
    preread_timeout 3s;
    proxy_connect_timeout 1s;
    proxy_timeout 30s;
    proxy_next_upstream off;
    access_log off;
}
