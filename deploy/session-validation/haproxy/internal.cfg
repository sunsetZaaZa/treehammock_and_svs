global
    maxconn 1024
    nbthread 2
    hard-stop-after 20s

defaults
    mode tcp
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout tunnel 30s
    retries 0

frontend svs_private
    bind 10.77.1.11:9443
    maxconn 256
    acl svs_ingress src 10.77.0.10/32
    tcp-request connection reject if !svs_ingress
    default_backend svs_replicas

backend svs_replicas
    mode tcp
    balance roundrobin
    server svs1 10.77.2.21:8443 check inter 2s fall 2 rise 2 maxconn 128
    server svs2 10.77.2.22:8443 check inter 2s fall 2 rise 2 maxconn 128
